<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Cyan Pulse Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>

    <!-- Green Success Path Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#69F0AE" />
    </linearGradient>

    <!-- Red Divergent Path Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="40%" stop-color="#FFD600" />
      <stop offset="100%" stop-color="#FF5252" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Container Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4" />

  <!-- Background Grid Lines -->
  <g stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.45">
    <line x1="80" y1="120" x2="432" y2="120" />
    <line x1="80" y1="184" x2="432" y2="184" />
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="80" y1="328" x2="432" y2="328" />
    <line x1="80" y1="392" x2="432" y2="392" />
    <line x1="120" y1="80" x2="120" y2="432" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <line x1="392" y1="80" x2="392" y2="432" />
  </g>

  <!-- Ambient Central Flare -->
  <circle cx="210" cy="256" r="90" fill="#00E5FF" opacity="0.08" filter="url(#softGlow)" />
  <circle cx="392" cy="184" r="50" fill="#00E676" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="392" cy="328" r="50" fill="#FF5252" opacity="0.12" filter="url(#softGlow)" />

  <!-- Origin / Target Host Nexus (Left) -->
  <g id="originNode">
    <circle cx="120" cy="256" r="28" fill="#111827" stroke="#00E5FF" stroke-width="3.5" filter="url(#glow)" />
    <circle cx="120" cy="256" r="14" fill="#00E5FF" />
  </g>

  <!-- Shared Packet Conduit Path (Connecting to Divergence Decision Gate) -->
  <path d="M 120 256 L 210 256" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />

  <!-- Divergence Decision Gate (Central Diamond) -->
  <g id="decisionGate" transform="translate(210, 256)">
    <polygon points="0,-22 22,0 0,22 -22,0" fill="#0F172A" stroke="#00E5FF" stroke-width="3" filter="url(#glow)" />
    <!-- Delta / Diff Symbol inside Decision Node -->
    <path d="M 0 -10 L 9 8 L -9 8 Z" fill="none" stroke="#00E5FF" stroke-width="2" />
  </g>

  <!-- Path A: WORKING ENVIRONMENT (Upper Branch - Emerald Green) -->
  <path d="M 232 256 C 275 256, 310 184, 380 184" fill="none" stroke="url(#greenGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Path B: FAILING ENVIRONMENT (Lower Branch - Electric Coral / Red) -->
  <path d="M 232 256 C 275 256, 310 328, 380 328" fill="none" stroke="url(#redGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 4" filter="url(#glow)" />

  <!-- Working Endpoint Node (Top Right) -->
  <g id="workingNode">
    <circle cx="392" cy="184" r="26" fill="#111827" stroke="#00E676" stroke-width="3.5" filter="url(#glow)" />
    <!-- Checkmark Icon -->
    <path d="M 382 184 L 389 191 L 403 176" fill="none" stroke="#00E676" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Failing Endpoint Node (Bottom Right) -->
  <g id="failingNode">
    <circle cx="392" cy="328" r="26" fill="#111827" stroke="#FF5252" stroke-width="3.5" filter="url(#glow)" />
    <!-- Cross / Divergent Icon -->
    <path d="M 383 319 L 401 337 M 401 319 L 383 337" fill="none" stroke="#FF5252" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Delta / Divergence Marker Pinpoint Arrow -->
  <g id="rootCausePointer" transform="translate(248, 204)">
    <circle cx="0" cy="0" r="14" fill="#FFD600" opacity="0.2" filter="url(#glow)" />
    <polygon points="0,-8 7,6 -7,6" fill="#FFD600" />
  </g>
</svg>
