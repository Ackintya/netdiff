<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect x="1" y="1" width="1118" height="638" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="48" fill="#e6edf3" font-size="20" font-weight="700" class="sans">NetDiff Diagnostic Architecture</text>
  <text x="40" y="72" fill="#8b949e" font-size="13" class="sans">Target-scoped kernel telemetry · Causal graph diffing · Deterministic + grounded reasoning</text>
  <line x1="40" y1="92" x2="1080" y2="92" stroke="#30363d" stroke-width="1"/>

  <!-- Column 1: Capture & Causal Order -->
  <rect x="40" y="114" width="320" height="466" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="60" y="142" fill="#e6edf3" font-size="13" font-weight="700" class="sans">1. Causal Stack Layers</text>
  <text x="340" y="142" text-anchor="end" fill="#8b949e" font-size="11" class="mono">8 STAGES</text>
  <line x1="60" y1="154" x2="340" y2="154" stroke="#30363d" stroke-width="1"/>

  <g transform="translate(60, 170)" class="sans">
    <rect width="280" height="40" rx="6" fill="#0d1117" stroke="#30363d"/><text x="14" y="25" fill="#e6edf3" font-size="12" font-weight="600">1. DNS Resolution</text><text x="266" y="25" text-anchor="end" fill="#8b949e" font-size="11" class="mono">A/AAAA</text>
    <g transform="translate(0, 48)"><rect width="280" height="40" rx="6" fill="#0d1117" stroke="#d29922"/><text x="14" y="25" fill="#e6edf3" font-size="12" font-weight="600">2. Policy Rules</text><text x="266" y="25" text-anchor="end" fill="#d29922" font-size="11" class="mono">ip rule</text></g>
    <g transform="translate(0, 96)"><rect width="280" height="40" rx="6" fill="#0d1117" stroke="#30363d"/><text x="14" y="25" fill="#e6edf3" font-size="12" font-weight="600">3. FIB Route Lookup</text><text x="266" y="25" text-anchor="end" fill="#8b949e" font-size="11" class="mono">table</text></g>
    <g transform="translate(0, 144)"><rect width="280" height="40" rx="6" fill="#0d1117" stroke="#30363d"/><text x="14" y="25" fill="#e6edf3" font-size="12" font-weight="600">4. Interface &amp; MTU</text><text x="266" y="25" text-anchor="end" fill="#8b949e" font-size="11" class="mono">oper</text></g>
    <g transform="translate(0, 192)"><rect width="280" height="40" rx="6" fill="#0d1117" stroke="#30363d"/><text x="14" y="25" fill="#e6edf3" font-size="12" font-weight="600">5. Neighbor ARP / NDP</text><text x="266" y="25" text-anchor="end" fill="#8b949e" font-size="11" class="mono">L2 MAC</text></g>
    <g transform="translate(0, 240)"><rect width="280" height="40" rx="6" fill="#0d1117" stroke="#30363d"/><text x="14" y="25" fill="#e6edf3" font-size="12" font-weight="600">6. Firewall Filter</text><text x="266" y="25" text-anchor="end" fill="#8b949e" font-size="11" class="mono">nft/ipt</text></g>
    <g transform="translate(0, 288)"><rect width="280" height="40" rx="6" fill="#0d1117" stroke="#30363d"/><text x="14" y="25" fill="#e6edf3" font-size="12" font-weight="600">7. TCP Socket Info</text><text x="266" y="25" text-anchor="end" fill="#8b949e" font-size="11" class="mono">TCP_INFO</text></g>
    <g transform="translate(0, 336)"><rect width="280" height="40" rx="6" fill="#0d1117" stroke="#30363d"/><text x="14" y="25" fill="#e6edf3" font-size="12" font-weight="600">8. TLS &amp; X.509 Trust</text><text x="266" y="25" text-anchor="end" fill="#8b949e" font-size="11" class="mono">cert</text></g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 360 347 L 394 347" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Column 2: Dual Reasoning Core -->
  <rect x="400" y="114" width="320" height="466" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="420" y="142" fill="#e6edf3" font-size="13" font-weight="700" class="sans">2. Differential Engine</text>
  <text x="700" y="142" text-anchor="end" fill="#8b949e" font-size="11" class="mono">HYBRID</text>
  <line x1="420" y1="154" x2="700" y2="154" stroke="#30363d" stroke-width="1"/>

  <g transform="translate(420, 170)">
    <rect width="280" height="184" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="16" y="26" fill="#3fb950" font-size="12" font-weight="700" class="sans">Deterministic Causal DAG</text>
    <text x="16" y="46" fill="#8b949e" font-size="11" class="sans">100% offline · air-gapped ready</text>
    <text x="16" y="76" fill="#e6edf3" font-size="11.5" class="mono">• Isolates earliest divergence</text>
    <text x="16" y="98" fill="#e6edf3" font-size="11.5" class="mono">• Discards cascade noise</text>
    <text x="16" y="120" fill="#e6edf3" font-size="11.5" class="mono">• Generates safe Bash fixes</text>
    <text x="16" y="142" fill="#e6edf3" font-size="11.5" class="mono">• Selects verification probes</text>
    <text x="16" y="168" fill="#58a6ff" font-size="11" class="mono">Zero external API dependency</text>
  </g>

  <g transform="translate(420, 372)">
    <rect width="280" height="184" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="16" y="26" fill="#58a6ff" font-size="12" font-weight="700" class="sans">Optional Gemini AI Layer</text>
    <text x="16" y="46" fill="#8b949e" font-size="11" class="sans">OpenAPI responseSchema grounded</text>
    <text x="16" y="76" fill="#e6edf3" font-size="11.5" class="mono">• Hypothesis synthesis</text>
    <text x="16" y="98" fill="#e6edf3" font-size="11.5" class="mono">• Evidence-bound Q&amp;A (ask)</text>
    <text x="16" y="120" fill="#e6edf3" font-size="11.5" class="mono">• Netplan / permanent configs</text>
    <text x="16" y="142" fill="#e6edf3" font-size="11.5" class="mono">• Strictly snapshot-grounded</text>
    <text x="16" y="168" fill="#8b949e" font-size="11" class="mono">Config: netdiff auth &lt;key&gt;</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 720 347 L 754 347" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Column 3: Outputs & Operations -->
  <rect x="760" y="114" width="320" height="466" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="780" y="142" fill="#e6edf3" font-size="13" font-weight="700" class="sans">3. Triage &amp; Automation</text>
  <text x="1060" y="142" text-anchor="end" fill="#8b949e" font-size="11" class="mono">CLI + UI</text>
  <line x1="780" y1="154" x2="1060" y2="154" stroke="#30363d" stroke-width="1"/>

  <g transform="translate(780, 170)">
    <rect width="280" height="82" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="14" y="24" fill="#58a6ff" font-size="12" font-weight="600" class="mono">netdiff compare --remote</text>
    <text x="14" y="44" fill="#e6edf3" font-size="12" class="sans">Zero-Friction SSH Capture</text>
    <text x="14" y="64" fill="#8b949e" font-size="11" class="sans">Streams remote snapshots in memory.</text>
  </g>

  <g transform="translate(780, 266)">
    <rect width="280" height="94" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="14" y="24" fill="#3fb950" font-size="12" font-weight="600" class="mono">netdiff fix --apply</text>
    <text x="14" y="44" fill="#e6edf3" font-size="12" class="sans">Guarded Auto-Remediation</text>
    <text x="14" y="64" fill="#8b949e" font-size="11" class="sans">Applies fix, runs canary probe,</text>
    <text x="14" y="79" fill="#8b949e" font-size="11" class="sans">rolls back automatically on failure.</text>
  </g>

  <g transform="translate(780, 374)">
    <rect width="280" height="90" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="14" y="24" fill="#d29922" font-size="12" font-weight="600" class="mono">netdiff watch</text>
    <text x="14" y="44" fill="#e6edf3" font-size="12" class="sans">Baseline Drift Monitor</text>
    <text x="14" y="64" fill="#8b949e" font-size="11" class="sans">Periodic audits &amp; NDJSON alerts.</text>
  </g>

  <g transform="translate(780, 478)">
    <rect width="280" height="78" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="14" y="24" fill="#e6edf3" font-size="12" font-weight="600" class="mono">graph --export | ui</text>
    <text x="14" y="44" fill="#8b949e" font-size="11" class="sans">Primer-themed SVG, HTML &amp; Web UI.</text>
  </g>

  <text x="40" y="612" fill="#8b949e" font-size="11.5" class="mono">github.com/Ackintya/netdiff · MIT License</text>
</svg>
