<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="60%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#B9F6CA" />
    </linearGradient>

    <!-- Green Success Path Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#69F0AE" />
    </linearGradient>

    <!-- Red Divergent Path Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="40%" stop-color="#FFD600" />
      <stop offset="100%" stop-color="#FF5252" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Banner Background -->
  <rect width="1200" height="340" rx="20" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- Background Grid -->
  <g stroke="#1E293B" stroke-width="1" stroke-dasharray="4 6" opacity="0.3">
    <line x1="60" y1="80" x2="1140" y2="80" />
    <line x1="60" y1="160" x2="1140" y2="160" />
    <line x1="60" y1="240" x2="1140" y2="240" />
    <line x1="180" y1="40" x2="180" y2="300" />
    <line x1="360" y1="40" x2="360" y2="300" />
    <line x1="600" y1="40" x2="600" y2="300" />
    <line x1="840" y1="40" x2="840" y2="300" />
    <line x1="1040" y1="40" x2="1040" y2="300" />
  </g>

  <!-- Left: Glowing Logo / Emblem -->
  <g transform="translate(60, 45)">
    <!-- Container -->
    <rect width="250" height="250" rx="54" fill="#0B132B" stroke="#1E293B" stroke-width="2.5" />
    
    <!-- Ambient glow inside icon -->
    <circle cx="125" cy="125" r="50" fill="#00E5FF" opacity="0.08" filter="url(#softGlow)" />
    <circle cx="200" cy="85" r="30" fill="#00E676" opacity="0.12" filter="url(#softGlow)" />
    <circle cx="200" cy="165" r="30" fill="#FF5252" opacity="0.12" filter="url(#softGlow)" />

    <!-- Left Origin Node -->
    <circle cx="55" cy="125" r="16" fill="#111827" stroke="#00E5FF" stroke-width="2.5" filter="url(#glow)" />
    <circle cx="55" cy="125" r="8" fill="#00E5FF" />

    <!-- Trunk Line -->
    <path d="M 55 125 L 110 125" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />

    <!-- Decision Diamond -->
    <polygon points="110,111 124,125 110,139 96,125" fill="#0F172A" stroke="#00E5FF" stroke-width="2" filter="url(#glow)" />

    <!-- Path Upper: Working -->
    <path d="M 124 125 C 145 125, 165 85, 200 85" fill="none" stroke="url(#greenGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />

    <!-- Path Lower: Failing -->
    <path d="M 124 125 C 145 125, 165 165, 200 165" fill="none" stroke="url(#redGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 3" filter="url(#glow)" />

    <!-- Working Node -->
    <circle cx="200" cy="85" r="15" fill="#111827" stroke="#00E676" stroke-width="2.5" filter="url(#glow)" />
    <path d="M 194 85 L 198 89 L 206 80" fill="none" stroke="#00E676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Failing Node -->
    <circle cx="200" cy="165" r="15" fill="#111827" stroke="#FF5252" stroke-width="2.5" filter="url(#glow)" />
    <path d="M 195 160 L 205 170 M 205 160 L 195 170" fill="none" stroke="#FF5252" stroke-width="2" stroke-linecap="round" />

    <!-- Divergence Marker -->
    <polygon points="135,100 140,108 130,108" fill="#FFD600" filter="url(#glow)" />
  </g>

  <!-- Right: Branding & Typography -->
  <g transform="translate(350, 75)">
    <!-- Project Name -->
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1" fill="url(#titleGrad)">NetDiff</text>
    
    <!-- Tagline -->
    <text x="0" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#E2E8F0">
      Explain why a network connection works in one environment and fails in another.
    </text>

    <!-- Sub-description -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">
      Dual-DAG causal path modeling · Kernel TCP telemetry · Actionable remediation playbooks · Grounded AI
    </text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 160)">
      <!-- Pill 1: Causal DAG -->
      <g transform="translate(0, 0)">
        <rect width="168" height="30" rx="15" fill="rgba(0, 229, 255, 0.1)" stroke="#00E5FF" stroke-width="1.2" />
        <circle cx="16" cy="15" r="4" fill="#00E5FF" />
        <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E0F7FA">Causal DAG Engine</text>
      </g>

      <!-- Pill 2: Actionable Fix -->
      <g transform="translate(180, 0)">
        <rect width="180" height="30" rx="15" fill="rgba(0, 230, 118, 0.1)" stroke="#00E676" stroke-width="1.2" />
        <circle cx="16" cy="15" r="4" fill="#00E676" />
        <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E8F5E9">Remediation Playbook</text>
      </g>

      <!-- Pill 3: TCP_INFO Telemetry -->
      <g transform="translate(372, 0)">
        <rect width="186" height="30" rx="15" fill="rgba(255, 214, 0, 0.1)" stroke="#FFD600" stroke-width="1.2" />
        <circle cx="16" cy="15" r="4" fill="#FFD600" />
        <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FFFDE7">Kernel Socket Telemetry</text>
      </g>

      <!-- Pill 4: Grounded Q&A -->
      <g transform="translate(570, 0)">
        <rect width="190" height="30" rx="15" fill="rgba(186, 104, 200, 0.1)" stroke="#BA68C8" stroke-width="1.2" />
        <circle cx="16" cy="15" r="4" fill="#BA68C8" />
        <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#F3E5F5">Grounded AI Q&amp;A (ask)</text>
      </g>
    </g>
  </g>
</svg>
