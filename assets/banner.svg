      <circle cx="14" cy="13" r="3.5" fill="#58a6ff"/>
      <text x="25" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#e6edf3">Causal Path DAG</text>

