    <rect x="172" y="14" width="66" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="205" y="30" text-anchor="middle" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="600" fill="#8b949e">v0.5.0</text>

    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#8b949e">
