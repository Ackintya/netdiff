    <circle cx="42" cy="90" r="11" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5"/>
    <circle cx="42" cy="90" r="4.5" fill="#58a6ff"/>
    <path d="M 53 90 L 76 90" stroke="#8b949e" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="86,78 98,90 86,102 74,90" fill="#0d1117" stroke="#e6edf3" stroke-width="2"/>
    <circle cx="86" cy="90" r="2.5" fill="#d29922"/>
