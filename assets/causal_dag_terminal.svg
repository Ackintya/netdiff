<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Outer Window -->
  <rect x="1" y="1" width="1118" height="738" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Window Title Bar -->
  <path d="M 1 11 A 10 10 0 0 1 11 1 L 1109 1 A 10 10 0 0 1 1119 11 L 1119 42 L 1 42 Z" fill="#161b22"/>
  <line x1="1" y1="42" x2="1119" y2="42" stroke="#30363d" stroke-width="1"/>
  <circle cx="24" cy="21" r="5.5" fill="#f85149"/>
  <circle cx="43" cy="21" r="5.5" fill="#d29922"/>
  <circle cx="62" cy="21" r="5.5" fill="#3fb950"/>
  <text x="560" y="26" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="500" class="mono">netdiff graph good.ndiff bad.ndiff</text>

  <!-- Command -->
  <text x="36" y="78" fill="#58a6ff" font-size="13" font-weight="600" class="mono">$</text>
  <text x="52" y="78" fill="#e6edf3" font-size="13" font-weight="500" class="mono">netdiff graph good.ndiff bad.ndiff</text>

  <!-- Metadata Bar -->
  <rect x="36" y="96" width="1048" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="52" y="120" fill="#8b949e" font-size="12.5" class="mono">Target: <tspan fill="#e6edf3" font-weight="600">api.internal.corp:443</tspan></text>
  <text x="390" y="120" fill="#8b949e" font-size="12.5" class="mono">Working: <tspan fill="#3fb950" font-weight="600">laptop (tun0)</tspan></text>
  <text x="680" y="120" fill="#8b949e" font-size="12.5" class="mono">Failing: <tspan fill="#f85149" font-weight="600">workstation (eth0)</tspan></text>

  <!-- Layer 1 -->
  <circle cx="54" cy="166" r="4.5" fill="#3fb950"/>
  <text x="72" y="170" fill="#e6edf3" font-size="13" font-weight="600" class="mono">[1] DNS Resolution</text>
  <text x="310" y="170" fill="#3fb950" font-size="12" class="mono">MATCH</text>
  <text x="380" y="170" fill="#8b949e" font-size="12.5" class="mono">10.40.8.21</text>

  <line x1="54" y1="176" x2="54" y2="196" stroke="#30363d" stroke-width="1.5"/>

  <!-- Layer 2: Earliest Divergence -->
  <rect x="36" y="200" width="1048" height="96" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.2"/>
  <circle cx="54" cy="222" r="4.5" fill="#d29922"/>
  <text x="72" y="226" fill="#e6edf3" font-size="13" font-weight="600" class="mono">[2] Policy Routing (ip rule)</text>
  <text x="310" y="226" fill="#d29922" font-size="12" font-weight="600" class="mono">ROOT CAUSE</text>
  <text x="415" y="226" fill="#e6edf3" font-size="12.5" class="mono">from all to 10.40.0.0/16 lookup 200 != main</text>

  <text x="72" y="250" fill="#8b949e" font-size="12" class="mono">├── Routing Table:    <tspan fill="#e6edf3">table 200</tspan> != <tspan fill="#f85149">table 254 (main)</tspan></text>
  <text x="72" y="268" fill="#8b949e" font-size="12" class="mono">├── Egress Interface: <tspan fill="#3fb950">tun0</tspan> != <tspan fill="#f85149">eth0</tspan></text>
  <text x="72" y="286" fill="#8b949e" font-size="12" class="mono">└── Source IP:        <tspan fill="#e6edf3">10.8.0.14</tspan> != <tspan fill="#8b949e">192.168.1.84</tspan></text>

  <line x1="54" y1="300" x2="54" y2="320" stroke="#30363d" stroke-width="1.5"/>

  <!-- Layer 3 -->
  <circle cx="54" cy="332" r="4.5" fill="#3fb950"/>
  <text x="72" y="336" fill="#e6edf3" font-size="13" font-weight="600" class="mono">[3] Interface Link</text>
  <text x="310" y="336" fill="#3fb950" font-size="12" class="mono">MATCH</text>
  <text x="380" y="336" fill="#8b949e" font-size="12.5" class="mono">up (tun0 MTU 1420 | eth0 MTU 1500)</text>

  <line x1="54" y1="342" x2="54" y2="362" stroke="#30363d" stroke-width="1.5"/>

  <!-- Layer 4 -->
  <circle cx="54" cy="374" r="4.5" fill="#f85149"/>
  <text x="72" y="378" fill="#e6edf3" font-size="13" font-weight="600" class="mono">[4] TCP Connection</text>
  <text x="310" y="378" fill="#f85149" font-size="12" class="mono">FAIL</text>
  <text x="380" y="378" fill="#3fb950" font-size="12.5" class="mono">connected (27ms)</text>
  <text x="515" y="378" fill="#8b949e" font-size="12.5" class="mono">!=</text>
  <text x="540" y="378" fill="#f85149" font-size="12.5" class="mono">timeout (cascade from eth0 egress)</text>

  <!-- Summary Card -->
  <rect x="36" y="410" width="1048" height="84" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="56" y="436" fill="#d29922" font-size="11.5" font-weight="700" class="sans">EARLIEST DIVERGENCE SUMMARY</text>
  <text x="56" y="460" fill="#e6edf3" font-size="13" class="sans">Failing host omits policy rule for 10.40.0.0/16 lookup 200 and falls back to default table main (eth0).</text>
  <text x="56" y="480" fill="#8b949e" font-size="12" class="sans">Downstream TCP timeout is a cascade symptom of routing unencapsulated internal traffic out the physical NIC.</text>

  <!-- Remediation Card -->
  <rect x="36" y="512" width="1048" height="172" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="56" y="538" fill="#3fb950" font-size="11.5" font-weight="700" class="sans">RECOMMENDED REMEDIATION</text>

  <text x="56" y="564" fill="#8b949e" font-size="12" class="sans">Immediate fix:</text>
  <rect x="56" y="572" width="1008" height="32" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="70" y="593" fill="#e6edf3" font-size="12.5" class="mono">$ sudo ip rule add to 10.40.8.21/32 lookup 200</text>

  <text x="56" y="626" fill="#8b949e" font-size="12" class="sans">Guarded apply (with canary verification &amp; automatic rollback):</text>
  <rect x="56" y="634" width="1008" height="32" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="70" y="655" fill="#58a6ff" font-size="12.5" class="mono">$ netdiff fix api.internal.corp:443 --apply</text>

  <!-- Footer -->
  <text x="36" y="716" fill="#8b949e" font-size="11.5" class="mono">NetDiff v0.5.0 · Deterministic local analysis · github.com/Ackintya/netdiff</text>
</svg>
