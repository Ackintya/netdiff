name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files require gofmt formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build NetDiff CLI
        run: go build -v -o ./netdiff ./cmd/netdiff

      - name: Run unprivileged unit tests
        run: go test -v -race ./...

      - name: Run privileged Linux network laboratory
        run: sudo ./scripts/lab/lab.sh run-all
